version: '3.8'

services:
  cypress-boiler:
    build: .
    container_name: cypress-boiler
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
    volumes:
      - ./prisma:/app/prisma
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    external: true
    name: nginx-proxy